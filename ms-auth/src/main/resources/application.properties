spring.application.name=ms-auth
server.port=8081

# Base de datos local
spring.datasource.url=jdbc:postgresql://localhost:5432/depaya
spring.datasource.username=postgres
spring.datasource.password=defleppard

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# JWT
depaya.jwt.secret=d089d9a19b5985a4fe61d33db20606e78cd50914951ad4e09a17fa0229d405dc
depaya.jwt.expiracion-horas=8

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5
