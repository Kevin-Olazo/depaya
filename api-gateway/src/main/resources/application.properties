spring.application.name=api-gateway
server.port=8080

# CORS
depaya.cors.origenes=http://localhost:4200,http://localhost:5173

# Rutas
spring.cloud.gateway.server.webmvc.routes[0].id=ms-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ms-auth
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**,/api/usuarios/**

spring.cloud.gateway.server.webmvc.routes[1].id=ms-departamentos
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ms-departamentos
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/departamentos/**

spring.cloud.gateway.server.webmvc.routes[2].id=ms-reservas
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ms-reservas
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/reservas/**

spring.cloud.gateway.server.webmvc.routes[3].id=ms-pagos
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://ms-pagos
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/pagos/**

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s
